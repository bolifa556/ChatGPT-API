name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:windows
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 scripts/build-linux-release.py --arch x64
      - name: Verify Linux provider release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bundle="ChatGPT-API-Provider-$version-linux-x64"
          python3 tests/linux-package-test.py "release/$version/$bundle.tar.gz"
          mkdir -p "$RUNNER_TEMP/linux-release"
          tar -xzf "release/$version/$bundle.tar.gz" -C "$RUNNER_TEMP/linux-release"
          "$RUNNER_TEMP/linux-release/$bundle/payload/runtime/node" tests/linux-provider-test.mjs "$RUNNER_TEMP/linux-release/$bundle"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/macos-platform-test.mjs
      - run: node tests/macos-provider-test.mjs
      - run: node tests/macos-dmg-gui-test.mjs
      - run: python3 scripts/build-macos-release.py
      - name: Verify macOS API-only release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bundle="ChatGPT-API-Provider-$version-macos-arm64"
          python3 tests/macos-package-test.py "data/build/macos-provider/$bundle.tar.gz"
          if [ "$(uname -m)" = arm64 ]; then
            mkdir -p "$RUNNER_TEMP/macos-release"
            tar -xzf "data/build/macos-provider/$bundle.tar.gz" -C "$RUNNER_TEMP/macos-release"
            "$RUNNER_TEMP/macos-release/$bundle/payload/runtime/node" tests/macos-install-test.mjs "$RUNNER_TEMP/macos-release/$bundle"
          else
            echo "The native installer test requires an ARM64 runner; archive and POSIX provider checks completed."
          fi
      - name: Build and verify single-file DMG
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/build-macos-dmg.py
          python3 tests/macos-dmg-test.py "release/$version/ChatGPT-API-Provider-$version-macos-arm64.dmg"
